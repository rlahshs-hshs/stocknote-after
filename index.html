<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간외 단일가 급등주 분석</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;background:#f5f4f0;color:#1a1a1a;padding-bottom:40px}
.hero{background:#1a1a2e;color:#fff;padding:36px 20px 28px}
.hero-title{font-size:20px;font-weight:800;margin-bottom:6px}
.hero-sub{font-size:13px;opacity:.6}
.section{max-width:680px;margin:0 auto;padding:24px 16px 0}
.month-label{font-size:11px;font-weight:700;color:#888;letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;margin-top:24px}
.entry-card{display:flex;justify-content:space-between;align-items:center;background:#fff;border-radius:14px;border:1px solid rgba(0,0,0,.06);padding:16px;margin-bottom:8px;text-decoration:none;color:inherit}
.entry-card:hover{background:#f8f7f4}
.entry-date{font-size:13px;font-weight:700;margin-bottom:4px}
.entry-themes{font-size:12px;color:#888;margin-bottom:6px}
.entry-picks{display:flex;flex-wrap:wrap;gap:5px}
.pick-chip{background:#f0eefb;color:#7f77dd;padding:3px 9px;border-radius:8px;font-size:11px;font-weight:600}
.entry-arrow{font-size:20px;color:#ccc}
.empty{text-align:center;padding:60px 20px;color:#aaa;font-size:14px}
</style>
</head>
<body>
<div class="hero">
  <div class="hero-title">📊 시간외 단일가 급등주 분석</div>
  <div class="hero-sub">장 마감 후 공시·뉴스 기반 이슈 종목 분석 | DART 재무 + Claude AI</div>
</div>
<div class="section">
  <!-- 새 날짜 추가 시 아래 블록을 복사해서 위에 붙여넣기 -->
  <div class="empty">분석 리포트가 곧 업로드됩니다.</div>
</div>
</body>
</html>
