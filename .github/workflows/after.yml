name: 시간외 단일가 분석

on:
  schedule:
    # 매일 오후 6:30 KST = UTC 09:30
    - cron: '30 9 * * 1-5'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: pip install telethon requests pandas

      - name: 파이프라인 실행
        env:
          TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
          DART_API_KEY:      ${{ secrets.DART_API_KEY }}
          GITHUB_TOKEN:      ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -u pipeline.py

      - name: 결과 아티팩트 저장
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 시간외분석-${{ github.run_number }}
          path: output/
          retention-days: 7
